<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live presenter</title>
    <link rel="stylesheet" href="/src/css/live.css" />
  </head>
  <body class="live-page" data-live-surface="presenter">
    <p id="err" class="live-error" hidden></p>
    <div id="app" hidden>
      <div class="live-stage">
        <div class="live-frame">
          <header class="live-frame-head" id="live-head"></header>
          <div id="live-main" class="live-frame-body"></div>
          <footer class="live-frame-foot">
            <p class="live-frame-count" id="live-status"></p>
            <div id="live-dock" class="live-dock"></div>
          </footer>
        </div>
      </div>
    </div>
    <script type="module" src="/src/live/present.ts"></script>
  </body>
</html>
